# SonarQube / SonarCloud Enterprise Configuration Properties
sonar.projectKey=azure-enterprise-devsecops
sonar.projectName=Azure Enterprise Cloud & DevOps Platform
sonar.projectVersion=1.0.0

# Source & Test Code Directories
sonar.sources=sample-app/src,modules
sonar.tests=sample-app/tests
sonar.exclusions=**/node_modules/**,**/*.spec.js,**/*.test.js,**/.terraform/**,**/dist/**

# Code Coverage & Test Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.config.js,**/vendor/**

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
